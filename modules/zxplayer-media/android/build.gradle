apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def safeExtGet(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
    namespace "com.isherezahin.zxplayer.media"
    compileSdk safeExtGet("compileSdkVersion", 36)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Version is resolved by the React Native Gradle Plugin.
    implementation "com.facebook.react:react-android"
    // Same Media3 release as react-native-video, which owns the actual player.
    implementation "androidx.media3:media3-session:${safeExtGet("media3Version", "1.8.0")}"
    // Its plugin hook hands over each player, so the end of an item can be watched natively.
    implementation project(":react-native-video")
}
